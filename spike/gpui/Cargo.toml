# Throwaway GPUI feasibility spike for #340. Never merged into main.
[package]
name = "rhythm-gpui-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# Own workspace so the app workspace never builds this.
[workspace]

[dependencies]
gpui-kit = "=0.11.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.38", default-features = false, features = ["bundled"] }
tray-icon = "0.25"
