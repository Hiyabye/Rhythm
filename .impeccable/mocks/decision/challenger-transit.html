<!doctype html>

*{box-sizing:border-box;margin:0;padding:0}

.rail{background:#0E1A3A;color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:6px}

.rail a{padding:7px 10px;border-radius:999px;font-weight:600;color:#C9D2EA}

.l{display:flex;gap:8px;align-items:center;padding:4px 10px;font-size:12.5px}

main{padding:26px 34px}

.map{position:relative;height:420px;margin:18px 0 10px;background:#fff;border-radius:10px;border:1px solid #DCE0EA}
.line{position:absolute;left:60px;right:60px;height:8px;border-radius:4px}
.st{position:absolute;top:0;bottom:0;width:1px}
.dot{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid #0E1A3A;transform:translate(-50%,-50%)}
.x{width:34px;height:34px;border-width:5px}
.lab{position:absolute;font-size:12px;width:150px;transform:translateX(-50%);text-align:center}
.lab b{display:block;font-size:15px}
.tag{position:absolute;font-size:11.5px;background:#fff;border:1px solid #DCE0EA;border-radius:6px;padding:3px 7px;white-space:nowrap}
h2{font-size:15px;font-weight:800;margin:14px 0 6px}
.r{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #DCE0EA}
.r b{font-size:14px}
.r span{color:#55607E;font-size:12px}
