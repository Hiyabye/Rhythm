[package]
name = "rhythm-core"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
description = "Rhythm's app logic without the desktop shell: storage, migrations and shared models"
publish = false

[features]
# Test helpers (temporary stores, migration rollback fragments) for the app
# crate's tests. Enable only as a dev-dependency.
test-support = ["dep:tempfile"]

[dependencies]
rusqlite = { version = "0.38", default-features = false, features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
tempfile = { version = "3", optional = true }
rhythm-embed = { path = "../embed" }
rhythm-feed = { path = "../feed" }
rhythm-sources = { path = "../sources", features = ["studium"] }
scraper = { version = "0.24", default-features = false }
encoding_rs = "0.8"
sha2 = "0.10"

# The retired remote AI key is deleted from the OS credential store on upgrade.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2", default-features = false, features = ["v1", "apple-native-keyring-store"] }
[target.'cfg(windows)'.dependencies]
keyring = { version = "4.2", default-features = false, features = ["v1", "windows-native-keyring-store"] }

[dev-dependencies]
rhythm-feed = { path = "../feed", features = ["test-keys"] }
tempfile = "3"
