[package]
name = "rhythm-core"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
description = "Rhythm's app logic without the desktop shell: storage, migrations and shared models"
publish = false

[features]
# Test helpers (temporary stores, migration rollback fragments, the scripted
# eClass) for the app crate's tests. Enable only as a dev-dependency.
test-support = ["dep:tempfile"]

[dependencies]
rusqlite = { version = "0.38", default-features = false, features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros", "fs", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
tempfile = { version = "3", optional = true }
base64 = "0.22"
rhythm-embed = { path = "../embed" }
rhythm-feed = { path = "../feed" }
rhythm-sources = { path = "../sources", features = ["studium"] }
scraper = { version = "0.24", default-features = false }
encoding_rs = "0.8"
sha2 = "0.10"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

# Backups and resource and model files are hashed here; sha2 0.10 otherwise
# uses its software compressor on ARM. Retain full-file verification; enable
# the reviewed accelerator only on the tested Apple target.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
# The retired remote AI key is deleted from the OS credential store on upgrade.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
# Seat alerts (vendored and patched, see the root Cargo.toml).
mac-usernotifications = { version = "=0.3.1", default-features = false }
objc2-user-notifications = { version = "0.3.2", features = ["block2", "UNUserNotificationCenter", "UNNotificationSettings"] }
keyring = { version = "4.2", default-features = false, features = ["v1", "apple-native-keyring-store"] }
[target.'cfg(windows)'.dependencies]
# Job objects tie the embedding server to Rhythm; disk and memory checks; the
# WinRT toast sender with its shortcut, protocol and settings checks.
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Registry", "Win32_System_WinRT", "Win32_System_JobObjects", "Win32_Security"] }
keyring = { version = "4.2", default-features = false, features = ["v1", "windows-native-keyring-store"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
rhythm-feed = { path = "../feed", features = ["test-keys"] }
tempfile = "3"
