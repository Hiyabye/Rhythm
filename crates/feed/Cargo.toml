[package]
name = "rhythm-feed"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
license = "GPL-3.0-or-later"
description = "The signed notice feed format shared by Rhythm's collector and app"
publish = false

[dependencies]
# Ed25519 signing and SHA-256 (#174 decision; already compiled in through rustls).
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"

[features]
# Disposable RFC 8032 signing keys (`test_keys`) for the collector's and the
# app's tests; enabled only as a dev-dependency.
test-keys = []
