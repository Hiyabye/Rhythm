[package]
name = "rhythm-ai-worker"
version = "0.2.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Rhythm's isolated, local-only AI worker"

[features]
default = ["inference"]
inference = ["dep:mistralrs"]
metal = ["inference", "mistralrs/metal"]
cuda = ["inference", "mistralrs/cuda"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
filedescriptor = "0.8.3"
mistralrs = { version = "=0.8.1", optional = true, default-features = false }
