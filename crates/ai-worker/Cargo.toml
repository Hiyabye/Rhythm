[package]
name = "rhythm-ai-worker"
version = "1.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Rhythm's isolated, local-only AI worker"

# Used only by build.rs, which cargo-machete does not scan.
[package.metadata.cargo-machete]
ignored = ["static_vcruntime"]

[build-dependencies]
static_vcruntime = "3.0"

[features]
default = ["inference"]
inference = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]
metal = ["inference", "llama-cpp-2/metal", "llama-cpp-sys-2/metal"]
# Windows NVIDIA worker. Build separately with --no-default-features.
gpu-inference = ["inference", "llama-cpp-2/vulkan", "llama-cpp-sys-2/vulkan"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
filedescriptor = "0.8.3"
llama-cpp-2 = { version = "=0.1.160", optional = true, default-features = false, features = ["common"] }
llama-cpp-sys-2 = { version = "=0.1.160", optional = true, default-features = false, features = ["common"] }
