name: Release draft (explicit tag, draft only)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (must match all checked-in version metadata)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rhythm-release-draft-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate trusted release tag and reject existing release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Validate tag provenance on trusted main
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main^{commit})"
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            echo "Release tag does not point to a commit reachable from trusted main."
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "RELEASE_COMMIT=$tag_commit" >> "$GITHUB_ENV"
          git checkout --detach "$tag_commit"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify tag and version metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error(`Invalid release tag: ${tag}`);
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')).version;
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const expected = `v${pkg}`;
          if (packageLock !== pkg || tauri !== pkg || cargo !== pkg || tag !== expected) {
            throw new Error(`Tag/version mismatch: tag=${tag}, package=${pkg}, lock=${packageLock}, tauri=${tauri}, rhythm=${cargo}`);
          }
          fs.writeFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${pkg}\n`, { flag: 'a' });
          console.log(`Validated ${tag}`);
          NODE
      - name: Refuse to overwrite an existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi

  signed-bundles:
    name: Developer ID notarized macOS Apple Silicon artifacts
    needs: validate
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    environment:
      name: release-signing
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Import Developer ID certificate and notarization key
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$APPLE_API_KEY_CONTENT"
          keychain="$RUNNER_TEMP/rhythm-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/notary-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
      - name: Build, Developer ID sign, notarize and staple
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RHYTHM_UPDATER_PUBKEY: ${{ secrets.RHYTHM_UPDATER_PUBKEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          test -n "$RHYTHM_UPDATER_PUBKEY"
          node scripts/macos-release.mjs --updater
      - name: Verify updater signature, bundle contents and stage assets
        env:
          RHYTHM_UPDATER_PUBKEY: ${{ secrets.RHYTHM_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          source=target/release/bundle/notarized
          mkdir release-assets
          shopt -s nullglob
          dmgs=("$source"/*.dmg)
          test "${#dmgs[@]}" -eq 1
          test "$(basename "${dmgs[0]}")" = "Rhythm_${version}_aarch64.dmg"
          cp "${dmgs[0]}" "$source/Rhythm.app.tar.gz" "$source/Rhythm.app.tar.gz.sig" release-assets/
          # Cryptographic check of the exact staged bytes; a non-empty .sig alone is not accepted.
          node scripts/verify-update.mjs artifact --artifact release-assets/Rhythm.app.tar.gz --version "$version"
          node scripts/verify-update.mjs bundle --archive release-assets/Rhythm.app.tar.gz --version "$version"
          node -e 'const fs=require("node:fs");const signature=fs.readFileSync("release-assets/Rhythm.app.tar.gz.sig","utf8").trim();fs.writeFileSync("release-assets/platforms-darwin-aarch64.json",JSON.stringify({asset:"Rhythm.app.tar.gz",signature}))'
      - uses: actions/upload-artifact@v4
        with:
          name: rhythm-signed-macos-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Create GitHub draft release (never publish)
    needs: [validate, signed-bundles]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment:
      name: release-signing
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: rhythm-signed-*
          path: release-assets
          merge-multiple: true
      - name: Revalidate tag and assemble stable metadata and checksums
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const tag = process.env.RELEASE_TAG;
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')).version;
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (tag !== `v${version}` || packageLock !== version || tauri !== version || cargo !== version) throw new Error('Release tag/version metadata changed or do not match.');
          const root = 'release-assets';
          const record = JSON.parse(fs.readFileSync(path.join(root, 'platforms-darwin-aarch64.json'), 'utf8'));
          fs.rmSync(path.join(root, 'platforms-darwin-aarch64.json'));
          const url = `https://github.com/${process.env.GH_REPO}/releases/download/${tag}/${encodeURIComponent(record.asset)}`;
          const platforms = { 'darwin-aarch64': { url, signature: record.signature }, 'darwin-aarch64-app': { url, signature: record.signature } };
          const manifest = { version, notes: `Rhythm ${version}`, pub_date: new Date().toISOString(), platforms };
          fs.writeFileSync(path.join(root, 'latest.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          const files = fs.readdirSync(root).filter((name) => name !== 'SHA256SUMS').sort();
          const sums = files.map((name) => `${crypto.createHash('sha256').update(fs.readFileSync(path.join(root, name))).digest('hex')}  ${name}`).join('\n') + '\n';
          fs.writeFileSync(path.join(root, 'SHA256SUMS'), sums);
          console.log(`Prepared ${tag} metadata for ${Object.keys(platforms).join(', ')}`);
          NODE
      - name: Verify the stable manifest against the staged artifact
        env:
          RHYTHM_UPDATER_PUBKEY: ${{ secrets.RHYTHM_UPDATER_PUBKEY }}
        run: node scripts/verify-update.mjs manifest --manifest release-assets/latest.json --assets release-assets --version "${RELEASE_TAG#v}" --repo "$GH_REPO" --tag "$RELEASE_TAG"
      - name: Refuse overwrite and create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$tag_commit" = "$RELEASE_COMMIT"
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -gt 0
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --draft --verify-tag --title "$RELEASE_TAG" --notes "Draft generated from Developer ID signed, notarized and stapled artifacts whose updater signature was verified against the configured public key. Review SHA256SUMS and release notes before publishing."

