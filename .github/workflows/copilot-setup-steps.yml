name: Copilot setup steps

# Environment for the GitHub Copilot coding agent; it reads this file from the
# default branch. Changes to it run once here to prove the setup still works.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/agent-setup.sh

permissions:
  contents: read

jobs:
  # Copilot picks up only a job with exactly this name.
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: scripts/agent-setup.sh
      # Warm the build of what Linux can check (see AGENTS.md, cloud agents).
      - run: cargo test --locked --no-run -p rhythm-sources -p rhythm-collector -p rhythm-feed -p rhythm-embed
      - run: npx playwright install --with-deps chromium webkit
