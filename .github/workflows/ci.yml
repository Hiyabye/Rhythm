name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:desktop
      - run: npx playwright install chromium webkit
      - run: npm run test:ui
      - run: cargo fmt --all -- --check
      - name: Build real CPU worker and stage for app tests
        run: |
          cargo build --locked -p rhythm-ai-worker
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/debug/rhythm-ai-worker.exe src-tauri/binaries/rhythm-ai-worker-x86_64-pc-windows-msvc.exe
          "RHYTHM_WORKER_TEST_BIN=$((Resolve-Path target/debug/rhythm-ai-worker.exe).Path)" >> $env:GITHUB_ENV
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Build unsigned NSIS installer (no publish)
        run: npm run desktop:build
