name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      LLAMA_BUILD_SHARED_LIBS: 0
      CMAKE_GENERATOR: Ninja
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Prepare MSVC and Ninja environment
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ tools are missing' }
          Import-Module (Join-Path $vsPath 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $ninjaPath = Join-Path $vsPath 'Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja'
          if (-not (Test-Path -LiteralPath (Join-Path $ninjaPath 'ninja.exe'))) { throw 'Ninja is missing' }
          foreach ($name in @('INCLUDE','LIB','LIBPATH','VCINSTALLDIR','VCToolsInstallDir','VCToolsRedistDir','WindowsSdkDir','WindowsSDKVersion','WindowsLibPath')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" >> $env:GITHUB_ENV }
          }
          $env:PATH -split ';' | Where-Object { $_ } | ForEach-Object { $_ >> $env:GITHUB_PATH }
          $ninjaPath >> $env:GITHUB_PATH
      - name: Prepare pinned Vulkan and libclang build tools
        run: |
          $toolsRoot = Join-Path $env:RUNNER_TEMP 'rhythm-gpu-tools'
          New-Item -ItemType Directory -Force $toolsRoot | Out-Null
          $sdkInstaller = Join-Path $toolsRoot 'vulkan-sdk.exe'
          $llvmInstaller = Join-Path $toolsRoot 'llvm.exe'
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/vulkansdk-windows-X64-1.4.363.0.exe' -OutFile $sdkInstaller
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-win64.exe' -OutFile $llvmInstaller
          if ((Get-FileHash $sdkInstaller -Algorithm SHA256).Hash -ne '94A82D378F7A5E3E54C9DB7D2FB7016AF136E14AC0A18DBF0F2F67A36352D141') { throw 'Vulkan SDK checksum mismatch' }
          if ((Get-FileHash $llvmInstaller -Algorithm SHA256).Hash -ne '3197846A2B19063687DD56E93E34CD941E3548D907F23A6131571321BDF9FE7B') { throw 'LLVM checksum mismatch' }
          $sdkPath = Join-Path $toolsRoot 'vulkan'
          $llvmPath = Join-Path $toolsRoot 'llvm'
          # Hosted runners need the Vulkan loader for protocol tests even with no GPU.
          # Local development can use copy_only=1 with its existing NVIDIA driver;
          # this disposable CI machine uses the normal SDK/runtime installation.
          $sdkProcess = Start-Process -FilePath $sdkInstaller -ArgumentList @('--root', $sdkPath, '--accept-licenses', '--default-answer', '--confirm-command', 'install') -WindowStyle Hidden -Wait -PassThru
          if ($sdkProcess.ExitCode -ne 0) { throw "Vulkan SDK preparation failed ($($sdkProcess.ExitCode))" }
          $llvmProcess = Start-Process -FilePath $llvmInstaller -ArgumentList @('/S', "/D=$llvmPath") -WindowStyle Hidden -Wait -PassThru
          if ($llvmProcess.ExitCode -ne 0) { throw "LLVM preparation failed ($($llvmProcess.ExitCode))" }
          foreach ($required in @("$sdkPath/Bin/glslc.exe", "$sdkPath/Lib/vulkan-1.lib", "$llvmPath/bin/libclang.dll")) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing GPU build tool: $required" }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:WINDIR 'System32/vulkan-1.dll'))) {
            throw 'Vulkan loader is missing; GPU process tests cannot run on this runner.'
          }
          "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$llvmPath/bin" >> $env:GITHUB_ENV
          "$sdkPath/Bin" >> $env:GITHUB_PATH
          "RHYTHM_GPU_TARGET_DIR=$((Join-Path $env:RUNNER_TEMP 'g'))" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:desktop
      - run: npx playwright install chromium webkit
      - run: npm run test:ui
      - run: cargo fmt --all -- --check
      - name: Build real CPU worker and stage for app tests
        run: |
          cargo build --locked -p rhythm-ai-worker
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/debug/rhythm-ai-worker.exe src-tauri/binaries/rhythm-ai-worker-x86_64-pc-windows-msvc.exe
          "RHYTHM_WORKER_TEST_BIN=$((Resolve-Path target/debug/rhythm-ai-worker.exe).Path)" >> $env:GITHUB_ENV
      - name: Stage verified app-local Microsoft runtime files
        run: ./scripts/stage-vc-runtime.ps1
      - name: Build and stage GPU worker (compilation is not GPU hardware validation)
        run: |
          cargo build --locked -p rhythm-ai-worker --target-dir $env:RHYTHM_GPU_TARGET_DIR --no-default-features --features gpu-inference
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$env:RHYTHM_GPU_TARGET_DIR/debug/rhythm-ai-worker.exe" src-tauri/binaries/rhythm-ai-worker-gpu-x86_64-pc-windows-msvc.exe
      - run: cargo clippy --locked -p rhythm-ai-worker --target-dir $env:RHYTHM_GPU_TARGET_DIR --no-default-features --features gpu-inference --all-targets -- -D warnings
      - run: cargo test --locked -p rhythm-ai-worker --target-dir $env:RHYTHM_GPU_TARGET_DIR --no-default-features --features gpu-inference
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Build unsigned NSIS installer (no publish)
        run: npm run desktop:build
