name: Checks

on:
  # Branches get one run through their pull request; a push trigger on every
  # branch duplicated the full Windows job. main runs after each merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Each concern runs once, and only when its files changed
# (scripts/ci-changes.mjs). Skipped jobs report as skipped, not failed.
jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      rust: ${{ steps.classify.outputs.rust }}
      packaging: ${{ steps.classify.outputs.packaging }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: classify
        env:
          CI_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-changes.mjs

  frontend:
    name: Frontend and scripts (Chromium + WebKit)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run test:release
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui

  rust-fmt:
    name: Rust formatting
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The desktop/windows job IDs and Cargo/CMake env must stay in step with
  # release.yml, which restores the rust-cache these jobs save on main.
  # A packaging-only change also runs clippy and tests; it is rare and main-only.
  desktop:
    name: macOS Rust (Apple Silicon)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.packaging == 'true'
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
      # macos-14 has 3 vCPUs and 7 GB; a cold build with 3 jobs never swapped.
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Only main saves: branch caches are invisible to other branches and
      # pushed the repository past GitHub's 10 GB limit, evicting main's.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      # Tauri embeds the built frontend at compile time.
      - run: npm run build
      - name: Build and stage worker for Tauri checks
        run: |
          cargo build --locked -p rhythm-ai-worker
          node -e 'const fs=require("node:fs"),p=require("node:path"),cp=require("node:child_process");const target=cp.execFileSync("rustc",["-vV"],{encoding:"utf8"}).match(/host: (.+)/)[1].trim();if(target!=="aarch64-apple-darwin")throw new Error(`Unexpected CI target: ${target}`);const bin=p.resolve("target/debug/rhythm-ai-worker");fs.mkdirSync("src-tauri/binaries",{recursive:true});fs.copyFileSync(bin,"src-tauri/binaries/rhythm-ai-worker-"+target);fs.appendFileSync(process.env.GITHUB_ENV,"RHYTHM_WORKER_TEST_BIN="+bin+"\n");'
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test storage and worker lifecycle (no model weights)
        run: cargo test --locked --workspace
      # Release builds take most of the job; they run on main when packaging
      # inputs changed and on manual runs, never on pull requests.
      - name: Build native desktop executable
        if: needs.changes.outputs.packaging == 'true'
        run: npm run desktop:build -- --no-bundle

  windows:
    name: Windows Rust (Windows 11 x64)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.packaging == 'true'
    runs-on: windows-latest
    env:
      # windows-latest has 4 vCPUs and 16 GB of memory.
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      LLAMA_BUILD_SHARED_LIBS: 0
      CMAKE_GENERATOR: Ninja
      # Inside the workspace so rust-cache can save it; D:\a\Rhythm\Rhythm\target-gpu
      # stays within the 32-character limit for Vulkan shader compilation.
      RHYTHM_GPU_TARGET_DIR: ${{ github.workspace }}\target-gpu
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Prepare and verify Cloud Files for restore tests
        run: ./scripts/prepare-windows-restore-ci.ps1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            . -> target-gpu
      - uses: ./.github/actions/windows-build-tools
      - run: npm ci
      - run: npm run build
      - name: Build real CPU worker and stage for app tests
        run: |
          cargo build --locked -p rhythm-ai-worker
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item target/debug/rhythm-ai-worker.exe src-tauri/binaries/rhythm-ai-worker-x86_64-pc-windows-msvc.exe
          "RHYTHM_WORKER_TEST_BIN=$((Resolve-Path target/debug/rhythm-ai-worker.exe).Path)" >> $env:GITHUB_ENV
      - name: Stage verified app-local Microsoft runtime files
        run: ./scripts/stage-vc-runtime.ps1
      - name: Build and stage GPU worker (compilation is not GPU hardware validation)
        run: |
          cargo build --locked -p rhythm-ai-worker --target-dir $env:RHYTHM_GPU_TARGET_DIR --no-default-features --features gpu-inference
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$env:RHYTHM_GPU_TARGET_DIR/debug/rhythm-ai-worker.exe" src-tauri/binaries/rhythm-ai-worker-gpu-x86_64-pc-windows-msvc.exe
      - run: cargo clippy --locked -p rhythm-ai-worker --target-dir $env:RHYTHM_GPU_TARGET_DIR --no-default-features --features gpu-inference --all-targets -- -D warnings
      - run: cargo test --locked -p rhythm-ai-worker --target-dir $env:RHYTHM_GPU_TARGET_DIR --no-default-features --features gpu-inference
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Build unsigned NSIS installer (no publish)
        if: needs.changes.outputs.packaging == 'true'
        run: |
          # Keep child scripts on the CI host with its matching PowerShell modules.
          $env:RHYTHM_POWERSHELL = Join-Path $PSHOME 'pwsh.exe'
          npm run desktop:build
