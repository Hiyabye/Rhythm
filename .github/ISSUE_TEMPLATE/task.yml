name: Task
description: A feature, fix or change that a person or an AI agent can pick up
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change, and why. Link related issues and PRs.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current state
      description: What happens now. Name relevant files, boards or docs.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable criteria.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope and constraints
      description: What not to touch, decisions that apply, approvals needed (live runs, deploys, releases).
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Checks beyond the AGENTS.md defaults (native app, Windows, live collector run, real model).
