name: Task
description: A feature, fix or change, written so a person or an AI agent can pick it up
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change, and why. Link related issues and PRs.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current state
      description: What happens now. Include the relevant files, boards or docs (e.g. `crates/sources/src/k2web/boards.rs`, `docs/ARCHITECTURE.md`).
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable acceptance criteria.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope and constraints
      description: What not to touch, user decisions that apply, approvals needed (live runs, deploys, releases).
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Checks that must run beyond the defaults in AGENTS.md (native app, Windows, live collector run, real model).
