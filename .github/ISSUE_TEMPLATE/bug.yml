name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What happened, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: v2.4.1, macOS 26 (Apple Silicon) / Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal data (학번, eClass content, credentials) before posting.
