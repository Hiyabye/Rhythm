[package]
name = "rhythm"
version = "1.5.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Local-first personal command center"

# Used only by build.rs, which cargo-machete does not scan.
[package.metadata.cargo-machete]
ignored = ["tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros", "fs", "net"] }
rusqlite = { version = "0.38", default-features = false, features = ["bundled", "backup"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
scraper = { version = "0.24", default-features = false }
sha2 = "0.10"
url = "2"
base64 = "0.22"
getrandom = "0.3"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# sha2 0.10 otherwise uses its software compressor on ARM. Retain full-file
# verification; enable the reviewed accelerator only on the tested Apple target.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-user-notifications = { version = "0.3.2", features = ["block2", "UNUserNotificationCenter", "UNNotificationSettings"] }
mac-usernotifications = { version = "=0.3.1", default-features = false }
# Remote API keys stay in the OS credential store, never SQLite or a file.
keyring = { version = "4.2", default-features = false, features = ["v1", "apple-native-keyring-store"] }
# Windows registers login startup in the per-user Run key instead.
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-autostart = "2.7"
[target.'cfg(windows)'.dependencies]
keyring = { version = "4.2", default-features = false, features = ["v1", "windows-native-keyring-store"] }
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Registry", "Win32_System_WinRT", "Win32_Security", "Win32_System_JobObjects"] }


[dev-dependencies]
minisign-verify = "=0.3.0"
tempfile = "3"
