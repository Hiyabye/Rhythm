[package]
name = "rhythm"
version = "2.4.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
description = "Local-first personal command center"

# Used only by build.rs, which cargo-machete does not scan.
[package.metadata.cargo-machete]
ignored = ["tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros", "fs", "net", "signal"] }
rusqlite = { version = "0.38", default-features = false, features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.10"
url = "2"
base64 = "0.22"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
rhythm-core = { path = "../crates/core" }

# sha2 0.10 otherwise uses its software compressor on ARM. Retain full-file
# verification; enable the reviewed accelerator only on the tested Apple target.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
# Windows registers login startup in the per-user Run key instead.
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-autostart = "2.7"


[dev-dependencies]
rhythm-core = { path = "../crates/core", features = ["test-support"] }
minisign-verify = "=0.3.0"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
